<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>HilbertLM Chat</title>
    <link rel="icon" type="image/png" href="../figures/icon.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="stars" aria-hidden="true"></canvas>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-content">
                <a href="../index.html" class="home-button" title="Back to documentation">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </a>
                <h1><img src="../figures/icon.png" alt="HilbertLM logo" class="hero-logo">HilbertLM</h1>
                <button class="clear-button" id="clear-button" title="Clear conversation">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                </button>
            </div>
            <div class="status" id="status">Connected to Hugging Face Cloud ☁️</div>
        </div>

        <div class="chat-messages" id="chat-messages">
        </div>

        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <input type="text" id="user-input" placeholder="Ask me what you want... (English only)">
                <button id="send-button">Send</button>
            </div>
        </div>
    </div>

    <script>
        marked.setOptions({
            highlight: function (code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            },
            breaks: true
        });

        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const clearButton = document.getElementById('clear-button');
        const statusEl = document.getElementById('status');

        const API_URL = "https://baillietn-hilbertlm-space.hf.space/chat";

        let conversationHistory = [];

        let currentAbortController = null;
        let isGenerating = false;
        let lastUserMessageDiv = null;
        let lastAssistantMessageDiv = null;

        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            if (role === 'user') {
                avatar.textContent = '👤';
            } else {
                const avatarImg = document.createElement('img');
                avatarImg.src = '../figures/icon.png';
                avatarImg.alt = 'Assistant avatar';
                avatar.appendChild(avatarImg);
            }

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            if (content === '...') {
                contentDiv.classList.add('blinking-cursor');
            } else {
                contentDiv.innerHTML = marked.parse(content);
            }

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return { messageDiv, contentDiv };
        }

        async function handleSend() {
            const message = userInput.value.trim();
            if (!message) return;

            isGenerating = true;
            sendButton.textContent = 'Stop';
            sendButton.style.background = 'var(--stop-bg)';
            userInput.disabled = true;

            const userNodes = addMessage('user', message);
            lastUserMessageDiv = userNodes.messageDiv;
            userInput.value = '';

            conversationHistory.push({ role: "user", content: message });

            const assistantNodes = addMessage('assistant', '...');
            lastAssistantMessageDiv = assistantNodes.messageDiv;
            const responseContentDiv = assistantNodes.contentDiv;

            statusEl.textContent = 'Generating...';

            currentAbortController = new AbortController();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // Sending only the 3 last messages...
                    body: JSON.stringify({ messages: conversationHistory.slice(-3) }),
                    signal: currentAbortController.signal
                });

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                responseContentDiv.classList.remove('blinking-cursor');

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                let fullText = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    fullText += chunk;

                    let mathBlocks = [];

                    let protectedText = fullText.replace(/\$\$([\s\S]*?)\$\$/g, function (match) {
                        let index = mathBlocks.length;
                        mathBlocks.push(match);
                        return `MATHBLOCKPLACEHOLDER${index}END`;
                    });

                    let parsedHtml = marked.parse(protectedText);

                    mathBlocks.forEach((block, index) => {
                        parsedHtml = parsedHtml.replace(`MATHBLOCKPLACEHOLDER${index}END`, block);
                    });

                    responseContentDiv.innerHTML = parsedHtml;

                    try {
                        renderMathInElement(responseContentDiv, {
                            delimiters: [
                                { left: '$$', right: '$$', display: true },
                                { left: '$', right: '$', display: false },
                                { left: '\\(', right: '\\)', display: false },
                                { left: '\\[', right: '\\]', display: true }
                            ],
                            throwOnError: false
                        });
                    } catch (e) {
                        console.error("Erreur de rendu KaTeX :", e);
                    }

                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }

                conversationHistory.push({ role: "assistant", content: fullText });
                statusEl.textContent = 'Connected to Hugging Face Cloud ☁️';

            } catch (error) {
                if (error.name === 'AbortError') {
                    console.log('Chatbot response was aborted...');

                    if (lastUserMessageDiv) lastUserMessageDiv.remove();
                    if (lastAssistantMessageDiv) lastAssistantMessageDiv.remove();

                    conversationHistory.pop();

                    userInput.value = message;

                    statusEl.textContent = 'Generation stopped.';
                } else {
                    console.error('API Error:', error);
                    responseContentDiv.classList.remove('blinking-cursor');
                    responseContentDiv.textContent = 'Sorry, an error occurred.';
                    statusEl.textContent = 'Connection error.';
                    conversationHistory.pop();
                }
            } finally {
                isGenerating = false;
                sendButton.textContent = 'Send';
                sendButton.style.background = '';
                userInput.disabled = false;
                userInput.focus();
                currentAbortController = null;
            }
        }

        function clearConversation() {
            conversationHistory = [];

            chatMessages.innerHTML = '';

            clearButton.classList.add('clearing');
            setTimeout(() => {
                clearButton.classList.remove('clearing');
            }, 300);

            statusEl.textContent = '🗑️ Conversation cleared';
            setTimeout(() => {
                statusEl.textContent = 'Connected to Hugging Face Cloud ☁️';
            }, 2000);

            console.log('Conversation history cleared');
        }

        clearButton.addEventListener('click', () => {
            if (conversationHistory.length === 0) {
                statusEl.textContent = 'No conversation to clear';
                setTimeout(() => {
                    statusEl.textContent = 'Connected to Hugging Face Cloud ☁️';
                }, 1500);
                return;
            }

            if (isGenerating) {
                if (confirm('A message is being generated. Clear anyway?')) {
                    if (currentAbortController) {
                        currentAbortController.abort();
                    }
                    clearConversation();
                }
            } else {
                if (conversationHistory.length > 4) {
                    if (confirm(`Clear ${conversationHistory.length} messages?`)) {
                        clearConversation();
                    }
                } else {
                    clearConversation();
                }
            }
        });

        sendButton.addEventListener('click', () => {
            if (isGenerating && currentAbortController) {
                currentAbortController.abort();
            } else {
                handleSend();
            }
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isGenerating) handleSend();
        });

        userInput.focus();
    </script>
    <script>
        (function () {
            var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
            var c = document.getElementById('stars'), x = c.getContext('2d');
            var w, h, dpr, stars = [], mx = 0, t = 0;
            function size() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
                c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
                var n = Math.round(innerWidth * innerHeight / 5600);
                stars = []; for (var i = 0; i < n; i++) stars.push({
                    x: Math.random() * w, y: Math.random() * h, z: Math.random() * 0.8 + 0.2,
                    r: (Math.random() * 1.3 + 0.3) * dpr, a: Math.random() * 0.5 + 0.35,
                    tw: Math.random() * 1.6 + 0.4, ph: Math.random() * 6.28, hue: Math.random() < 0.25 ? 195 : 210
                });
            }
            addEventListener('resize', size);
            addEventListener('pointermove', function (e) { mx = (e.clientX / innerWidth - 0.5); });
            size();
            function frame() {
                t += 0.016; x.clearRect(0, 0, w, h);
                for (var i = 0; i < stars.length; i++) {
                    var s = stars[i];
                    if (!reduce) { s.y -= s.z * 0.16 * dpr; if (s.y < -2) s.y = h + 2; }
                    var px = s.x + mx * 36 * s.z * dpr;
                    var a = reduce ? s.a : s.a * (0.55 + 0.45 * Math.sin(t * s.tw + s.ph));
                    x.beginPath(); x.fillStyle = 'hsla(' + s.hue + ',100%,82%,' + a + ')'; x.arc(px, s.y, s.r, 0, 6.283); x.fill();
                    if (s.r > 1.4 * dpr) { x.beginPath(); x.fillStyle = 'hsla(' + s.hue + ',100%,80%,' + (a * 0.12) + ')'; x.arc(px, s.y, s.r * 3, 0, 6.283); x.fill(); }
                }
                requestAnimationFrame(frame);
            }
            if (reduce) { for (var i = 0; i < stars.length; i++) { var s = stars[i]; x.beginPath(); x.fillStyle = 'hsla(' + s.hue + ',100%,82%,' + s.a + ')'; x.arc(s.x, s.y, s.r, 0, 6.283); x.fill(); } }
            else requestAnimationFrame(frame);
        })();
    </script>
</body>

</html>
