<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>HilbertLM Chat</title>
    <link rel="icon" type="image/png" href="../figures/icon.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap');

        :root {
            --bg: #040a18;
            --bg2: #071230;
            --ink: #e9f0fb;
            --muted: #9bb0cc;
            --blue: #36a6e0;
            --cyan: #62e3ff;
            --deep: #1f6fe0;
            --line: rgba(120, 170, 230, .14);
            --card: rgba(10, 21, 42, .62);
            --serif: 'IBM Plex Serif', Georgia, serif;
            --sans: 'IBM Plex Sans', system-ui, sans-serif;
            --mono: 'IBM Plex Mono', monospace;

            --bubble-user: linear-gradient(135deg, #2f74d0 0%, #36a6e0 100%);
            --bubble-user-text: #ffffff;
            --bubble-assistant: rgba(14, 26, 48, .6);
            --bubble-assistant-text: var(--ink);
            --inline-code-bg: rgba(98, 227, 255, .10);
            --send-bg: linear-gradient(135deg, var(--cyan), var(--blue));
            --stop-bg: linear-gradient(135deg, #ff7a7a, #ff476b);
            --status-color: var(--muted);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: var(--sans);
            color: var(--ink);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
            overflow: hidden;
            background:
                radial-gradient(1100px 700px at 50% -10%, rgba(54, 166, 224, .20), transparent 60%),
                radial-gradient(800px 600px at 12% 20%, rgba(31, 111, 224, .12), transparent 55%),
                radial-gradient(800px 700px at 90% 80%, rgba(98, 227, 255, .08), transparent 55%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg2) 55%, var(--bg) 100%);
        }

        #stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none
        }

        .chat-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 860px;
            height: 92vh;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
            backdrop-filter: blur(14px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            position: relative;
            padding: 18px 20px;
            text-align: center;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(180deg, rgba(54, 166, 224, .10), transparent);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 4px
        }

        .chat-header h1 {
            font-family: var(--serif);
            font-weight: 600;
            font-size: 22px;
            margin: 0;
            color: #eaf3ff;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -.01em;
        }

        .hero-logo {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 0 0 1px var(--line)
        }

        .status {
            font-family: var(--mono);
            font-size: 11px;
            margin-top: 4px;
            color: var(--status-color);
            letter-spacing: .02em
        }

        .home-button,
        .clear-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
            background: rgba(255, 255, 255, .06);
            border: 1px solid var(--line);
            text-decoration: none;
            transition: all .25s ease;
        }

        .home-button {
            left: 18px
        }

        .clear-button {
            right: 18px
        }

        .home-button:hover {
            background: rgba(98, 227, 255, .16);
            border-color: var(--cyan);
            transform: translateY(-50%) scale(1.08)
        }

        .clear-button:hover {
            background: rgba(255, 120, 120, .18);
            border-color: #ff7a7a;
            transform: translateY(-50%) scale(1.08)
        }

        .clear-button:active {
            transform: translateY(-50%) scale(.95)
        }

        .home-button svg,
        .clear-button svg {
            width: 19px;
            height: 19px
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateY(-50%) translateX(0)
            }

            25% {
                transform: translateY(-50%) translateX(-5px)
            }

            75% {
                transform: translateY(-50%) translateX(5px)
            }
        }

        .clear-button.clearing {
            animation: shake .3s ease;
            background: rgba(255, 100, 100, .4)
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 18px
        }

        .chat-messages::-webkit-scrollbar {
            width: 9px
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(98, 227, 255, .18);
            border-radius: 8px
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(98, 227, 255, .3)
        }

        .message {
            display: flex;
            gap: 13px;
            max-width: 86%;
            animation: fadeIn .3s ease-in
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line)
        }

        .message-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%
        }

        .message.user .message-avatar {
            background: var(--bubble-user);
            color: #fff;
            font-weight: bold;
            border: none
        }

        .message.assistant .message-avatar {
            background: rgba(54, 166, 224, .12)
        }

        .message-content {
            padding: 13px 17px;
            border-radius: 16px;
            word-wrap: break-word;
            line-height: 1.6;
            font-size: .96rem
        }

        .message.user .message-content {
            background: var(--bubble-user);
            color: var(--bubble-user-text);
            border-top-right-radius: 5px
        }

        .message.assistant .message-content {
            background: var(--bubble-assistant);
            color: var(--bubble-assistant-text);
            border: 1px solid var(--line);
            border-top-left-radius: 5px;
            backdrop-filter: blur(6px)
        }

        .message-content p {
            margin-bottom: 10px
        }

        .message-content p:last-child {
            margin-bottom: 0
        }

        .message-content pre {
            background: #0b1424;
            color: #dce6f7;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 13px;
            margin: 10px 0;
            overflow-x: auto;
            font-family: var(--mono);
            font-size: 13px
        }

        .message-content code {
            font-family: var(--mono);
            background: var(--inline-code-bg);
            color: #d6ecff;
            padding: 2px 5px;
            border-radius: 5px;
            font-size: .88em
        }

        .message-content pre code {
            background: transparent;
            padding: 0
        }

        .message-content ul,
        .message-content ol {
            margin-left: 20px;
            margin-bottom: 10px
        }

        .message-content a {
            color: var(--cyan)
        }

        .blinking-cursor::after {
            content: '\258B';
            animation: blink 1s step-end infinite;
            color: var(--cyan)
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0
            }
        }

        .chat-input-container {
            padding: 18px 20px;
            border-top: 1px solid var(--line);
            background: linear-gradient(0deg, rgba(54, 166, 224, .06), transparent)
        }

        .chat-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center
        }

        #user-input {
            flex: 1;
            padding: 13px 18px;
            border: 1px solid var(--line);
            border-radius: 24px;
            font-family: var(--sans);
            font-size: 14px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
            background: rgba(6, 14, 30, .6);
            color: var(--ink)
        }

        #user-input::placeholder {
            color: var(--muted)
        }

        #user-input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(98, 227, 255, .15)
        }

        #user-input:disabled {
            opacity: .6
        }

        #send-button {
            background: var(--send-bg);
            color: #02101f;
            border: none;
            padding: 13px 26px;
            border-radius: 24px;
            cursor: pointer;
            font-family: var(--mono);
            font-weight: 700;
            font-size: .85rem;
            letter-spacing: .02em;
            transition: transform .2s, box-shadow .2s;
            box-shadow: 0 10px 30px rgba(54, 166, 224, .35)
        }

        #send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 36px rgba(54, 166, 224, .5)
        }

        #send-button:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        .katex,
        .katex * {
            box-sizing: content-box;
        }

        @media (max-width:600px) {
            body {
                padding: 0
            }

            .chat-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                border: none
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }
    </style>
</head>

<body>
    <canvas id="stars" aria-hidden="true"></canvas>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-content">
                <a href="../index.html" class="home-button" title="Back to documentation">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </a>
                <h1><img src="../figures/icon.png" alt="HilbertLM logo" class="hero-logo">HilbertLM</h1>
                <button class="clear-button" id="clear-button" title="Clear conversation">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                </button>
            </div>
            <div class="status" id="status">Connected to Hugging Face Cloud ☁️</div>
        </div>

        <div class="chat-messages" id="chat-messages">
        </div>

        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <input type="text" id="user-input" placeholder="Ask me in English for code or an equation...">
                <button id="send-button">Send</button>
            </div>
        </div>
    </div>

    <script>
        marked.setOptions({
            highlight: function (code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            },
            breaks: true
        });

        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const clearButton = document.getElementById('clear-button');
        const statusEl = document.getElementById('status');

        const API_URL = "https://baillietn-hilbertlm-space.hf.space/chat";

        let conversationHistory = [];

        let currentAbortController = null;
        let isGenerating = false;
        let lastUserMessageDiv = null;
        let lastAssistantMessageDiv = null;

        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            if (role === 'user') {
                avatar.textContent = '👤';
            } else {
                const avatarImg = document.createElement('img');
                avatarImg.src = '../figures/icon.png';
                avatarImg.alt = 'Assistant avatar';
                avatar.appendChild(avatarImg);
            }

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            if (content === '...') {
                contentDiv.classList.add('blinking-cursor');
            } else {
                contentDiv.innerHTML = marked.parse(content);
            }

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return { messageDiv, contentDiv };
        }

        async function handleSend() {
            const message = userInput.value.trim();
            if (!message) return;

            isGenerating = true;
            sendButton.textContent = 'Stop';
            sendButton.style.background = 'var(--stop-bg)';
            userInput.disabled = true;

            const userNodes = addMessage('user', message);
            lastUserMessageDiv = userNodes.messageDiv;
            userInput.value = '';

            conversationHistory.push({ role: "user", content: message });

            const assistantNodes = addMessage('assistant', '...');
            lastAssistantMessageDiv = assistantNodes.messageDiv;
            const responseContentDiv = assistantNodes.contentDiv;

            statusEl.textContent = 'Generating...';

            currentAbortController = new AbortController();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // Sending only the 3 last messages...
                    body: JSON.stringify({ messages: conversationHistory.slice(-3) }),
                    signal: currentAbortController.signal
                });

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                responseContentDiv.classList.remove('blinking-cursor');

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                let fullText = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    fullText += chunk;

                    let mathBlocks = [];

                    let protectedText = fullText.replace(/\$\$([\s\S]*?)\$\$/g, function (match) {
                        let index = mathBlocks.length;
                        mathBlocks.push(match);
                        return `MATHBLOCKPLACEHOLDER${index}END`;
                    });

                    let parsedHtml = marked.parse(protectedText);

                    mathBlocks.forEach((block, index) => {
                        parsedHtml = parsedHtml.replace(`MATHBLOCKPLACEHOLDER${index}END`, block);
                    });

                    responseContentDiv.innerHTML = parsedHtml;

                    try {
                        renderMathInElement(responseContentDiv, {
                            delimiters: [
                                { left: '$$', right: '$$', display: true },
                                { left: '$', right: '$', display: false },
                                { left: '\\(', right: '\\)', display: false },
                                { left: '\\[', right: '\\]', display: true }
                            ],
                            throwOnError: false
                        });
                    } catch (e) {
                        console.error("Erreur de rendu KaTeX :", e);
                    }

                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }

                conversationHistory.push({ role: "assistant", content: fullText });
                statusEl.textContent = 'Connected to Hugging Face Cloud ☁️';

            } catch (error) {
                if (error.name === 'AbortError') {
                    console.log('Chatbot response was aborted...');

                    if (lastUserMessageDiv) lastUserMessageDiv.remove();
                    if (lastAssistantMessageDiv) lastAssistantMessageDiv.remove();

                    conversationHistory.pop();

                    userInput.value = message;

                    statusEl.textContent = 'Generation stopped.';
                } else {
                    console.error('API Error:', error);
                    responseContentDiv.classList.remove('blinking-cursor');
                    responseContentDiv.textContent = 'Sorry, an error occurred.';
                    statusEl.textContent = 'Connection error.';
                    conversationHistory.pop();
                }
            } finally {
                isGenerating = false;
                sendButton.textContent = 'Send';
                sendButton.style.background = '';
                userInput.disabled = false;
                userInput.focus();
                currentAbortController = null;
            }
        }

        function clearConversation() {
            conversationHistory = [];

            chatMessages.innerHTML = '';

            clearButton.classList.add('clearing');
            setTimeout(() => {
                clearButton.classList.remove('clearing');
            }, 300);

            statusEl.textContent = '🗑️ Conversation cleared';
            setTimeout(() => {
                statusEl.textContent = 'Connected to Hugging Face Cloud ☁️';
            }, 2000);

            console.log('Conversation history cleared');
        }

        clearButton.addEventListener('click', () => {
            if (conversationHistory.length === 0) {
                statusEl.textContent = 'No conversation to clear';
                setTimeout(() => {
                    statusEl.textContent = 'Connected to Hugging Face Cloud ☁️';
                }, 1500);
                return;
            }

            if (isGenerating) {
                if (confirm('A message is being generated. Clear anyway?')) {
                    if (currentAbortController) {
                        currentAbortController.abort();
                    }
                    clearConversation();
                }
            } else {
                if (conversationHistory.length > 4) {
                    if (confirm(`Clear ${conversationHistory.length} messages?`)) {
                        clearConversation();
                    }
                } else {
                    clearConversation();
                }
            }
        });

        sendButton.addEventListener('click', () => {
            if (isGenerating && currentAbortController) {
                currentAbortController.abort();
            } else {
                handleSend();
            }
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isGenerating) handleSend();
        });

        userInput.focus();
    </script>
    <script>
        (function () {
            var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
            var c = document.getElementById('stars'), x = c.getContext('2d');
            var w, h, dpr, stars = [], mx = 0, t = 0;
            function size() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
                c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
                var n = Math.round(innerWidth * innerHeight / 5600);
                stars = []; for (var i = 0; i < n; i++) stars.push({
                    x: Math.random() * w, y: Math.random() * h, z: Math.random() * 0.8 + 0.2,
                    r: (Math.random() * 1.3 + 0.3) * dpr, a: Math.random() * 0.5 + 0.35,
                    tw: Math.random() * 1.6 + 0.4, ph: Math.random() * 6.28, hue: Math.random() < 0.25 ? 195 : 210
                });
            }
            addEventListener('resize', size);
            addEventListener('pointermove', function (e) { mx = (e.clientX / innerWidth - 0.5); });
            size();
            function frame() {
                t += 0.016; x.clearRect(0, 0, w, h);
                for (var i = 0; i < stars.length; i++) {
                    var s = stars[i];
                    if (!reduce) { s.y -= s.z * 0.16 * dpr; if (s.y < -2) s.y = h + 2; }
                    var px = s.x + mx * 36 * s.z * dpr;
                    var a = reduce ? s.a : s.a * (0.55 + 0.45 * Math.sin(t * s.tw + s.ph));
                    x.beginPath(); x.fillStyle = 'hsla(' + s.hue + ',100%,82%,' + a + ')'; x.arc(px, s.y, s.r, 0, 6.283); x.fill();
                    if (s.r > 1.4 * dpr) { x.beginPath(); x.fillStyle = 'hsla(' + s.hue + ',100%,80%,' + (a * 0.12) + ')'; x.arc(px, s.y, s.r * 3, 0, 6.283); x.fill(); }
                }
                requestAnimationFrame(frame);
            }
            if (reduce) { for (var i = 0; i < stars.length; i++) { var s = stars[i]; x.beginPath(); x.fillStyle = 'hsla(' + s.hue + ',100%,82%,' + s.a + ')'; x.arc(s.x, s.y, s.r, 0, 6.283); x.fill(); } }
            else requestAnimationFrame(frame);
        })();
    </script>
</body>

</html>
